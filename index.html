<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shopping-list</title>
    <link href="src/style.css" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md gb-zinc-900 p-6 rounded-2xl shadow-2xl border border-zinc-800">
      <h1 class="text-3xl font-black text-transparent bg-clip-text bg-linear-to-r from-cyan-400 to-blue-500 mb-6 text-center tracking-tighter">
        SHOPPING LIST
      </h1>

      <div class="flex gap-2 mb-6">
        <input type="text" id="itemInput" placeholder="Mit vegyünk?" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-white">
        <button id="addButton" class="bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-bold px-6 py-3 rounded-xl transition-all active:scale-95 cursor-pointer">
          +
        </button>
      </div>

      <ul id="shoppingList" class="space-y-2">
        
      </ul>
      <button id="clearAll" class="mt-6 w-full text-zinc-500 hover:text-zinc-300 text-sm font-medium transition-colors py-2 border-t border-zinc-800 cursor-pointer">
        Összes törlése
      </button>
    </div>
    
    <script type="module" src="src/main.js"></script>
  </body>
</html>
